name: HC Player 1.5 source toolchain restore (UNSIGNED)

on:
  push:
    branches:
      - signpath-prep

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'
      - name: Verify MSBuild/MSVC and restore packages.config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild -version
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild v145 environment is not ready.' }
          if (-not (Test-Path -LiteralPath 'HC Player/packages.config')) { throw 'Missing packages.config' }
          nuget install 'HC Player/packages.config' -OutputDirectory packages -NonInteractive -Verbosity normal
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'packages/Microsoft.WindowsAppSDK.2.4.0')) {
            throw 'Pinned Windows App SDK 2.4.0 was not restored.'
          }
          "Toolchain and NuGet restore succeeded. This did not compile, package or sign HC Player." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
