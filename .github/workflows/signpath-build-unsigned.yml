          retention-days: 3
          if-no-files-found: error
) {
            $archive = Join-Path $env:RUNNER_TEMP 'HC_Player_1.5.1_LIBMPV_ORIGINAL_PARA_CI.zip'
            Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 5
            Assert-FileHash $archive 'dab6f6a85b6fd0964d4a01dc9b2d439369403f6056245afabd6bb0499083c327'
            Add-Type -AssemblyName System.IO.Compression
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
            try {
              $entries = @($zip.Entries | Where-Object {
                $_.Name -ieq 'libmpv-2.dll' -and $_.Length -gt 0
