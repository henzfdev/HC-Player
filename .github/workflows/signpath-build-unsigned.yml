name: HC Player 1.5 build verification (UNSIGNED)

on:
  push:
    branches:
      - signpath-prep
  workflow_dispatch:
    inputs:
      libmpv_url:
        description: 'Versioned GitHub Release asset URL to exact libmpv-2.dll OR the frozen original CI ZIP. Both zip and extracted DLL are SHA-256-checked.'
        required: true
        type: string
      build_installer:
        description: 'Also run the original Inno Setup 7 installer scripts if all audited source files and ISCC.exe are available'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/signpath-prep' && (inputs.libmpv_url != '' || vars.HC_LIBMPV_URL != '')
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select MSBuild (Visual Studio 2026 / v145)
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      - name: Verify original dependency provenance (fail closed)
        shell: pwsh
        env:
          HC_LIBMPV_URL: ${{ inputs.libmpv_url || vars.HC_LIBMPV_URL }}
          HC_BUILD_INSTALLER: ${{ inputs.build_installer || vars.HC_SIGNPATH_BUILD_INSTALLER == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-FileHash([string] $Path, [string] $Expected) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "Missing required file: $Path"
            }
            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Expected) { throw "Hash mismatch: $Path ; got $actual ; expected $Expected" }
            Write-Host "[OK] Verified SHA256 $Path"
          }
          $url = $env:HC_LIBMPV_URL
          if ($url -notmatch '^https://github\.com/henzfdev/HC-Player/releases/download/[^/]+/[^/]+          Assert-FileHash 'HC Player/third_party/mediainfo/x64/MediaInfo.dll' 'a2612fa8bf639349aee9747d8a555d361f5db95b049b3af9b0c3851a21a4308d'
          Assert-FileHash 'HC Player/scripts/stats.lua' '7cead8a7b39a9fbd0ccb54b367dce48f65339695dbfb085b873c86ed9b93b247'
          Assert-FileHash 'HC Player/HC Player.ico' 'ec75352a2abc90fe265079e0f7bc567ddb154eb4aa28f59a73707f8bb25a613f'
          if ($env:HC_BUILD_INSTALLER -eq 'true') {
            Assert-FileHash 'Installer/HC_Player_1.5.1_x64.iss' '0f2d3151b98ce074da1ef0057b0019c74ad583d699b734ca9bf71ea9733c7251'
            Assert-FileHash 'Installer/InstallerAssets/HCPlayer_Setup.ico' 'f540bb0f98165dc1a90684bd4d1cbed29adaacff708b5364435b5307dcace773'
            foreach ($script in @('GERAR-INSTALADOR-V1.ps1', 'CHECK-PAYLOAD.ps1', 'STAGE-PAYLOAD.ps1','DOWNLOAD-PREREQUISITES.ps1','BUILD-INSTALLER.ps1')) {
              if (-not (Test-Path -LiteralPath "Installer/$script" -PathType Leaf)) {
                throw "Required original Inno source missing: Installer/$script"
              }
            }
          }

      - name: Restore pinned NuGet packages.config dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget install 'HC Player/packages.config' -OutputDirectory packages -NonInteractive -Verbosity normal
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed with exit code $LASTEXITCODE" }

      - name: Build Release x64 from current branch (not signed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild 'HC Player/HC Player.vcxproj' /t:Rebuild /p:Configuration=Release /p:Platform=x64 /m:2 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "Release x64 compilation failed: $LASTEXITCODE" }

      - name: Check unsigned application output
        id: app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = @(Get-ChildItem -Path 'HC Player', 'x64' -File -Recurse -Filter 'HC Player.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' -and $_.FullName -notmatch '[\\/]Installer[\\/]' })
          if ($found.Count -ne 1) { throw "Expected one Release HC Player.exe, found $($found.Count)." }
          $exe = $found[0].FullName
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
          if ($version -ne '1.5.1.0') { throw "Unexpected application version: $version" }
          $out = $found[0].Directory.FullName
          Write-Host "Release output: $out"
          "release_output=$out" >> $env:GITHUB_OUTPUT

      - name: Generate unsigned Inno Setup installer (optional, original SAFE scripts only)
        if: inputs.build_installer || vars.HC_SIGNPATH_BUILD_INSTALLER == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 7 is not preinstalled on this runner. Obtain a verified Inno Setup 7 installation before enabling packaging. No fallback to an older Inno or weakening the SAFE checker.' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'Installer/GERAR-INSTALADOR-V1.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Original installer scripts failed: $LASTEXITCODE" }

      - name: Upload UNSIGNED app build for private QA
        uses: actions/upload-artifact@v7
        with:
          name: HC-Player-1.5-unsigned-QA
          path: ${{ steps.app.outputs.release_output }}
          retention-days: 3
          if-no-files-found: error

      - name: Upload UNSIGNED installer for private QA (optional)
        if: inputs.build_installer || vars.HC_SIGNPATH_BUILD_INSTALLER == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: HC-Player-1.5-unsigned-installer-QA
          path: |
            Installer/Output/HC_Player_1.5.1_x64_Setup.exe
            Installer/Output/HC_Player_1.5.1_x64_Setup.exe.sha256.txt
          retention-days: 3
          if-no-files-found: error
) {
            throw 'libmpv URL must point to a versioned GitHub Release asset in henzfdev/HC-Player. Do not use latest/mutable URLs.'
          }
          $dll = 'HC Player/third_party/libmpv/x64/libmpv-2.dll'
          New-Item -ItemType Directory -Path (Split-Path -Parent $dll) -Force | Out-Null
          if ($url -match '/HC_Player_1\.5\.1_LIBMPV_ORIGINAL_PARA_CI\.zip          Assert-FileHash 'HC Player/third_party/mediainfo/x64/MediaInfo.dll' 'a2612fa8bf639349aee9747d8a555d361f5db95b049b3af9b0c3851a21a4308d'
          Assert-FileHash 'HC Player/scripts/stats.lua' '7cead8a7b39a9fbd0ccb54b367dce48f65339695dbfb085b873c86ed9b93b247'
          Assert-FileHash 'HC Player/HC Player.ico' 'ec75352a2abc90fe265079e0f7bc567ddb154eb4aa28f59a73707f8bb25a613f'
          if ($env:HC_BUILD_INSTALLER -eq 'true') {
            Assert-FileHash 'Installer/HC_Player_1.5.1_x64.iss' '0f2d3151b98ce074da1ef0057b0019c74ad583d699b734ca9bf71ea9733c7251'
            Assert-FileHash 'Installer/InstallerAssets/HCPlayer_Setup.ico' 'f540bb0f98165dc1a90684bd4d1cbed29adaacff708b5364435b5307dcace773'
            foreach ($script in @('GERAR-INSTALADOR-V1.ps1', 'CHECK-PAYLOAD.ps1', 'STAGE-PAYLOAD.ps1','DOWNLOAD-PREREQUISITES.ps1','BUILD-INSTALLER.ps1')) {
              if (-not (Test-Path -LiteralPath "Installer/$script" -PathType Leaf)) {
                throw "Required original Inno source missing: Installer/$script"
              }
