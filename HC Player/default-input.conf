# Playback
Space       cycle pause

# Navigation / video state
n           no-osd cycle video-unscaled; show-text "${?video-unscaled==yes:🎞 Vídeo sem escala: Sim}${?video-unscaled==no:🎞 Vídeo sem escala: Não}" 2000
F12         no-osd playlist-next; show-text "⏭ Próximo arquivo" 2000
F11         no-osd playlist-prev; show-text "⏮ Arquivo anterior" 2000
PGUP        no-osd add chapter  1; show-text "⏭ Próximo capítulo" 2000
PGDWN       no-osd add chapter -1; show-text "⏮ Capítulo anterior" 2000
.           no-osd frame-step 1 mute; show-text "▶| Próximo quadro" 1000
,           no-osd frame-back-step; show-text "|◀ Quadro anterior" 1000
Right       no-osd seek  5; show-text "⏩ +5 segundos" 1500
Left        no-osd seek -5; show-text "⏪ -5 segundos" 1500
Up          no-osd seek  30; show-text "⏩ +30 segundos" 1500
Down        no-osd seek -30; show-text "⏪ -30 segundos" 1500
Ctrl+Right  no-osd seek  300; show-text "⏩ +5 minutos" 1500
Ctrl+Left   no-osd seek -300; show-text "⏪ -5 minutos" 1500

# Editions
E           no-osd cycle edition; show-text "🎬 Edição: ${edition:Indisponível}" 2000

# Video
KP8         no-osd cycle video; show-text "🎞 Faixa de vídeo: ${?video==no:Nenhuma}${!video==no:${video}}" 2000
Ctrl+1      no-osd add contrast -1; show-text "🎨 Contraste: ${contrast}" 1500
Ctrl+2      no-osd add contrast  1; show-text "🎨 Contraste: ${contrast}" 1500
Ctrl+3      no-osd add brightness -1; show-text "☀ Brilho: ${brightness}" 1500
Ctrl+4      no-osd add brightness  1; show-text "☀ Brilho: ${brightness}" 1500
Ctrl+5      no-osd add gamma -1; show-text "🌗 Gama: ${gamma}" 1500
Ctrl+6      no-osd add gamma  1; show-text "🌗 Gama: ${gamma}" 1500
Ctrl+7      no-osd add saturation -1; show-text "🌈 Saturação: ${saturation}" 1500
Ctrl+8      no-osd add saturation  1; show-text "🌈 Saturação: ${saturation}" 1500
s           no-osd async screenshot; show-text "📸 Captura de tela salva" 2000
S           no-osd async screenshot video; show-text "📸 Captura salva (sem legendas)" 2000
a           no-osd cycle-values video-aspect-override 16:9 4:3 2.35:1 -1; show-text "📐 Proporção: ${video-aspect-override}" 2000
Ctrl+r      no-osd cycle-values video-rotate 90 180 270 0; show-text "🔄 Rotação: ${video-rotate}°" 2000
D           no-osd cycle deband; show-text "${?deband==yes:🔲 Deband: Ativado}${?deband==no:🔲 Deband: Desativado}" 2000
d           no-osd cycle deinterlace; show-text "${?deinterlace==yes:📺 Desentrelaçamento: Ativado }${?deinterlace==no:📺 Desentrelaçamento: Desativado }${?deinterlace==auto:📺 Desentrelaçamento: Automático }" 2000

# Audio
KP7         no-osd cycle audio; show-text "🔊 Faixa de áudio: ${?audio==no:Nenhuma}${!audio==no:${audio}}" 2000
Ctrl+d      no-osd add audio-delay  0.1; show-text "🔊 Atraso de áudio: ${audio-delay}s" 1500
Ctrl+D      no-osd add audio-delay -0.1; show-text "🔊 Atraso de áudio: ${audio-delay}s" 1500

# Subtitles
j           no-osd cycle sub; show-text "💬 Legenda: ${?sid==no:Não}${!sid==no:${sid}}" 2000
v           no-osd cycle sub-visibility; show-text "${?sub-visibility==yes:💬 Legenda: Visível}${?sub-visibility==no:💬 Legenda: Oculta}" 2000
z           no-osd add sub-delay -0.1; show-text "💬 Atraso da legenda: ${sub-delay}s" 1500
Z           no-osd add sub-delay  0.1; show-text "💬 Atraso da legenda: ${sub-delay}s" 1500
r           no-osd add sub-pos -1; show-text "💬 Posição da legenda: ${sub-pos}" 1500
R           no-osd add sub-pos +1; show-text "💬 Posição da legenda: ${sub-pos}" 1500
Alt+j       no-osd cycle secondary-sid; show-text "💬 Legenda secundária: ${?secondary-sid==no:Não}${!secondary-sid==no:${secondary-sid}}" 2000
Alt+v       no-osd cycle secondary-sub-visibility; show-text "${?secondary-sub-visibility==yes:💬 Legenda secundária: Visível}${?secondary-sub-visibility==no:💬 Legenda secundária: Oculta}" 2000
Alt+z       no-osd add secondary-sub-delay -0.1; show-text "💬 Atraso da legenda secundária: ${secondary-sub-delay}s" 1500
Alt+Z       no-osd add secondary-sub-delay  0.1; show-text "💬 Atraso da legenda secundária: ${secondary-sub-delay}s" 1500
Alt+r       no-osd add secondary-sub-pos -1; show-text "💬 Posição da legenda secundária: ${secondary-sub-pos}" 1500
Alt+R       no-osd add secondary-sub-pos +1; show-text "💬 Posição da legenda secundária: ${secondary-sub-pos}" 1500
F           no-osd add sub-scale -0.1; show-text "💬 Tamanho da fonte: ${sub-scale}" 1500
G           no-osd add sub-scale  0.1; show-text "💬 Tamanho da fonte: ${sub-scale}" 1500

# Imported profiles are generated by HC Player at runtime
# IMPORTED_PROFILES_MENU

# Pan & Scan
Ctrl++      no-osd add video-zoom  0.1; show-text "🔍 Zoom: ${video-zoom}" 1500
Ctrl+-      no-osd add video-zoom -0.1; show-text "🔍 Zoom: ${video-zoom}" 1500
Ctrl+KP4    no-osd add video-pan-x -0.01; show-text "↔ Pan X: ${video-pan-x}" 1500
Ctrl+KP6    no-osd add video-pan-x  0.01; show-text "↔ Pan X: ${video-pan-x}" 1500
Ctrl+KP8    no-osd add video-pan-y -0.01; show-text "↕ Pan Y: ${video-pan-y}" 1500
Ctrl+KP2    no-osd add video-pan-y  0.01; show-text "↕ Pan Y: ${video-pan-y}" 1500
w           no-osd add panscan -0.1; show-text " Pan & Scan: ${panscan}" 1500
W           no-osd add panscan  0.1; show-text " Pan & Scan: ${panscan}" 1500
Ctrl+BS     no-osd set video-zoom 0; no-osd set video-pan-x 0; no-osd set video-pan-y 0; show-text "🔄 Pan & Scan resetado" 2000

# Playback speed
[           no-osd multiply speed 1/1.1; show-text "⏱ Velocidade: ${speed}x" 1500
]           no-osd multiply speed 1.1; show-text "⏱ Velocidade: ${speed}x" 1500
{           no-osd multiply speed 0.5; show-text "⏱ Velocidade: ${speed}x (metade)" 1500
}           no-osd multiply speed 2.0; show-text "⏱ Velocidade: ${speed}x (dobro)" 1500
BS          cycle pause

# Volume
+           no-osd add volume  2; show-text "🔊 Volume: ${volume}%" 1500
-           no-osd add volume -2; show-text "🔊 Volume: ${volume}%" 1500
m           no-osd cycle mute; show-text "${?mute==yes:🔇 Mudo: Sim }${?mute==no:🔊 Mudo: Não }" 2000

# Window / OSD
Alt++   no-osd add window-scale 0.1; show-text "🖥 Tamanho da janela: ${window-scale}x" 1500
Alt+-   no-osd add window-scale -0.1; show-text "🖥 Tamanho da janela: ${window-scale}x" 1500
Alt+0   no-osd set window-scale 0.5; show-text "🖥 Janela: 50%" 1500
Alt+1   no-osd set window-scale 1.0; show-text "🖥 Janela: 100%" 1500
Alt+2   no-osd set window-scale 2.0; show-text "🖥 Janela: 200%" 1500
Alt+3   no-osd set window-scale 3.0; show-text "🖥 Janela: 300%" 1500
O       no-osd cycle-values osd-level 3 1; show-text "🕐 OSD de tempo alternado" 1500
p       show-progress

# Screenshot shortcut not owned by the toolbar
Ctrl+S  no-osd screenshot subtitles; show-text "📸 Captura do conteúdo salva" 2000

# Playback tools
l       no-osd ab-loop; show-text "🔁 Loop A-B: ${?ab-loop-a==no:Não}${!ab-loop-a==no:${ab-loop-a}} → ${?ab-loop-b==no:Não}${!ab-loop-b==no:${ab-loop-b}}" 2000
L       no-osd cycle-values loop-file inf no; show-text "${?loop-file==inf:🔁 Loop de arquivo: Ativado }${?loop-file==no:🔁 Loop de arquivo: Desativado }" 2000
Ctrl+h  no-osd cycle-values hwdec auto no; show-text "⚙ Decodificação: ${?hwdec==auto:Automática }${?hwdec==no:Desativada }" 2000

# Extra playback / subtitle controls
Tab           no-osd show-text "🎞 Quadro Atual: ${estimated-frame-number} / ${estimated-frame-count}" 3000
J           no-osd cycle sub down; show-text "💬 Legenda anterior: ${?sid==no:Não}${!sid==no:${sid}}" 2000
A           no-osd cycle-values video-aspect-override -1 2.35:1 4:3 16:9; show-text "📐 Proporção (Invertida): ${video-aspect-override}" 2000
V           no-osd cycle-values sub-ass-use-video-data none all aspect-ratio; show-text "💬 Legenda (Propriedades de vídeo): ${?sub-ass-use-video-data==none:Nenhuma ✖}${?sub-ass-use-video-data==all:Todas ✔}${?sub-ass-use-video-data==aspect-ratio:Proporção de tela 📐}" 2000
u           no-osd cycle-values sub-ass-override force strip no; show-text "💬 Estilo da Legenda (ASS): ${?sub-ass-override==no:Padrão Original 🎬}${?sub-ass-override==force:Forçar Estilo Personalizado 🎨}${?sub-ass-override==strip:Texto Limpo (Sem Formatação) ✖}" 2000

# HDR / scaling
B no-osd cycle-values target-peak 200 150 120 100; show-text "Pico HDR: ${target-peak}"

Alt+d no-osd cycle-values dscale spline16 hermite; show-text "Redução de escala: ${dscale}"
